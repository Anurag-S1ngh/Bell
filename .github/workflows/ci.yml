name: ci
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FALKORDB_URL: falkordb://localhost:6379
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bell
          POSTGRES_PASSWORD: bell
          POSTGRES_DB: bell
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bell -d bell"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: "pattern=$(printf '%s' "com" "pany" "_" "brain"); grep -RiE "$pattern" . --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.turbo && exit 1 || true"
      - run: bun run check
      - run: bun run check-types
      - run: bun run db:migrate -F @Bell/db
      - run: bun run build
