services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bell
      POSTGRES_PASSWORD: bell
      POSTGRES_DB: bell
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bell -d bell"]
      interval: 5s
      timeout: 5s
      retries: 10

  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3002:3000"
    volumes:
      - falkordata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://bell:bell@postgres:5432/bell
      FALKORDB_URL: falkordb://falkordb:6379
      BELL_GROUP_ID: default
      BELL_AUTH_TOKEN: ${BELL_AUTH_TOKEN:-}
      BELL_LLM_TIMEOUT_MS: ${BELL_LLM_TIMEOUT_MS:-30000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  falkordata:
